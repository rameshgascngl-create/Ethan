name: Android signed release

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/varugai-android-release
    paths:
      - 'android/**'
      - 'app/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'app/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: varugai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Verify, build, sign and audit Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js for canonical attendance tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Xvfb for Electron functional test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install canonical app test dependencies
        run: npm ci

      - name: Run canonical VARUGAI functional tests
        run: npm test

      - name: Run Android fail-closed source gate
        run: python3 android/tools/verify_release_source.py

      - name: Set up Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify signing secrets are configured
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KS_B64: ${{ secrets.VARUGAI_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.VARUGAI_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VARUGAI_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VARUGAI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo 'VARUGAI_KEYSTORE_BASE64 is missing'; exit 1; }
          test -n "$KS_PASS" || { echo 'VARUGAI_KEYSTORE_PASSWORD is missing'; exit 1; }
          test -n "$KS_ALIAS" || { echo 'VARUGAI_KEY_ALIAS is missing'; exit 1; }
          test -n "$KEY_PASS" || { echo 'VARUGAI_KEY_PASSWORD is missing'; exit 1; }
          echo 'All four signing secrets are present.'

      - name: Reconstruct release keystore in runner temp directory
        env:
          VARUGAI_KEYSTORE_BASE64: ${{ secrets.VARUGAI_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/varugai-release.jks"
          printf '%s' "$VARUGAI_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "VARUGAI_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Keystore reconstructed: $(wc -c < "$KEYSTORE") bytes"

      - name: Verify keystore alias before build
        env:
          VARUGAI_KEYSTORE_PASSWORD: ${{ secrets.VARUGAI_KEYSTORE_PASSWORD }}
          VARUGAI_KEY_ALIAS: ${{ secrets.VARUGAI_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$VARUGAI_KEYSTORE_FILE" \
            -storepass "$VARUGAI_KEYSTORE_PASSWORD" \
            -alias "$VARUGAI_KEY_ALIAS" >/dev/null
          echo 'Keystore and alias validated.'

      - name: Build release APK and AAB
        working-directory: android
        env:
          VARUGAI_KEYSTORE_PASSWORD: ${{ secrets.VARUGAI_KEYSTORE_PASSWORD }}
          VARUGAI_KEY_ALIAS: ${{ secrets.VARUGAI_KEY_ALIAS }}
          VARUGAI_KEY_PASSWORD: ${{ secrets.VARUGAI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace clean :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease

      - name: Stage artifacts with stable release names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/android
          APK='android/app/build/outputs/apk/release/app-release.apk'
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          cp "$APK" release/android/VARUGAI-15.1.0-release.apk
          cp "$AAB" release/android/VARUGAI-15.1.0-release.aab

      - name: Verify APK signature and certificate
        shell: bash
        run: |
          set -euo pipefail
          APK='release/android/VARUGAI-15.1.0-release.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release/android/APKSIGNER.txt
          grep -q 'Verified' release/android/APKSIGNER.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' release/android/APKSIGNER.txt

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB='release/android/VARUGAI-15.1.0-release.aab'
          jarsigner -verify "$AAB" 2>&1 | tee release/android/AAB_SIGNATURE.txt
          grep -qi 'jar verified' release/android/AAB_SIGNATURE.txt

      - name: Audit packaged manifest and reject INTERNET permission
        shell: bash
        run: |
          set -euo pipefail
          APK='release/android/VARUGAI-15.1.0-release.apk'
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$APKANALYZER" manifest permissions "$APK" | tee release/android/PERMISSIONS.txt
          if grep -q 'android.permission.INTERNET' release/android/PERMISSIONS.txt; then
            echo 'FAIL: INTERNET permission found in final APK.' >&2
            exit 1
          fi
          {
            echo "applicationId=$($APKANALYZER manifest application-id "$APK")"
            echo "versionName=$($APKANALYZER manifest version-name "$APK")"
            echo "versionCode=$($APKANALYZER manifest version-code "$APK")"
            echo "minSdk=$($APKANALYZER manifest min-sdk "$APK")"
            echo "targetSdk=$($APKANALYZER manifest target-sdk "$APK")"
            echo "debuggable=$($APKANALYZER manifest debuggable "$APK")"
          } | tee release/android/IDENTITY.txt
          grep -q '^applicationId=com.gasczoology.varugai$' release/android/IDENTITY.txt
          grep -q '^versionName=15.1.0$' release/android/IDENTITY.txt
          grep -q '^versionCode=15100$' release/android/IDENTITY.txt
          grep -q '^targetSdk=36$' release/android/IDENTITY.txt
          grep -q '^debuggable=false$' release/android/IDENTITY.txt

      - name: Generate SHA-256 checksums and release evidence
        shell: bash
        run: |
          set -euo pipefail
          cd release/android
          sha256sum VARUGAI-15.1.0-release.apk VARUGAI-15.1.0-release.aab | tee SHA256SUMS.txt
          {
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "ref=${GITHUB_REF}"
            echo "built_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "apk_bytes=$(stat -c%s VARUGAI-15.1.0-release.apk)"
            echo "aab_bytes=$(stat -c%s VARUGAI-15.1.0-release.aab)"
          } | tee BUILD_EVIDENCE.txt

      - name: Upload signed release artifacts and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: VARUGAI-15.1.0-android-signed-release
          if-no-files-found: error
          retention-days: 30
          path: |
            release/android/VARUGAI-15.1.0-release.apk
            release/android/VARUGAI-15.1.0-release.aab
            release/android/SHA256SUMS.txt
            release/android/APKSIGNER.txt
            release/android/AAB_SIGNATURE.txt
            release/android/PERMISSIONS.txt
            release/android/IDENTITY.txt
            release/android/BUILD_EVIDENCE.txt
